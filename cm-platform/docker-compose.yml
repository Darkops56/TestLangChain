version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: novit_cm
      POSTGRES_USER: novit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novit"]
      interval: 5s
      timeout: 3s
      retries: 5

  cm-backend:
    build:
      context: ./cm-backend
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  cm-agent:
    build:
      context: ./cm-agent
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      cm-backend:
        condition: service_started

  cm-frontend:
    build:
      context: ./cm-frontend
    ports:
      - "80:80"
    depends_on:
      cm-backend:
        condition: service_started

volumes:
  pgdata:
