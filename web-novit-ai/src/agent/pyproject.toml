[project]
name = "community-manager-agent"
version = "1.0.0"
description = "AI Community Manager & Nurturing agent — LangGraph + LangChain"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "azure-storage-blob>=12.25.1",
    "Pillow>=10.0",
    "google-api-python-client>=2.169.0",
    "google-auth>=2.40.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "weasyprint>=62.0",
    "python-pptx>=0.6.21",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
